{% extends "base.html" %}
{% block titulo %}Entrar — Foto Vibe{% endblock %}

{% block conteudo %}
    <div class="cartao-formulario">
        <h1>Entrar</h1>
        <p class="subtitulo-formulario">Que bom te ver de novo.</p>

        <form method="post" class="formulario">
            <label for="identificador">Usuário ou e-mail</label>
            <input type="text" id="identificador" name="identificador" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit" class="botao-primario botao-largura-total">Entrar</button>
        </form>

        <p class="texto-secundario">
            Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a>
        </p>
    </div>
{% endblock %}
